<header class="app-header">
  <div class="app-header__izquierda">
    <a routerLink="/" class="app-header__logo" aria-label="Inicio">Acme ERP</a>
  </div>

  <div class="app-header__centro">
    <div class="app-header__busqueda" [class.app-header__busqueda--abierta]="mostrarResultados()">
      <input
        type="search"
        class="app-header__input"
        placeholder="Buscar pedidos, clientes, facturas, productos..."
        [value]="busqueda()"
        (input)="busqueda.set($any($event.target).value); buscar()"
        (focus)="buscar()"
        placeholder="Buscar..."
        aria-label="Búsqueda global"
        autocomplete="off"
      />
      @if (mostrarResultados() && resultados().length) {
        <ul class="app-header__resultados" role="listbox">
          @for (r of resultados(); track r.id) {
            <li class="app-header__resultado" role="option" (click)="irA(r.url)">
              <span class="app-header__resultado-icono">{{ r.icono }}</span>
              <div class="app-header__resultado-info">
                <span class="app-header__resultado-titulo">{{ r.titulo }}</span>
                <span class="app-header__resultado-subtitulo">{{ r.subtitulo }}</span>
              </div>
              <span class="app-header__resultado-categoria">{{ r.categoria }}</span>
            </li>
          }
        </ul>
      }
    </div>
  </div>

  <div class="app-header__derecha">
    <button type="button" class="app-header__tema" (click)="alternarTema()" [attr.aria-label]="theme.tema() === 'claro' ? 'Modo oscuro' : 'Modo claro'">
      @if (theme.tema() === 'claro') { ☀️ } @else { 🌙 }
    </button>
    <div class="app-header__usuario" *ngIf="usuario(); else loginBtn">
      <span class="app-header__usuario-nombre">{{ usuario()?.nombreCompleto }}</span>
      <button type="button" class="app-header__logout" (click)="logout()">Salir</button>
    </div>
    <ng-template #loginBtn>
      <a routerLink="/login" class="app-header__login">Entrar</a>
    </ng-template>
  </div>
</header>

<app-ui-toast-container />
