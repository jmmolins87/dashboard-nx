@if (abierto()) {
  <div class="ui-modal__overlay" (click)="cerrar.emit()">
    <div class="ui-modal__dialogo ui-modal__dialogo--{{ tamano() }}" role="dialog" aria-modal="true" [attr.aria-label]="titulo()" (click)="onDialogClick($event)">
      <header class="ui-modal__cabecera">
        <h2 class="ui-modal__titulo">{{ titulo() }}</h2>
        <button type="button" class="ui-modal__cerrar" (click)="cerrar.emit()" aria-label="Cerrar">×</button>
      </header>
      <div class="ui-modal__cuerpo"><ng-content /></div>
    </div>
  </div>
}
