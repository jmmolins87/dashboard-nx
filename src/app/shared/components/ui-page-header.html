<div class="ui-page-header">
  <div class="ui-page-header__info">
    <nav class="ui-page-header__breadcrumbs" aria-label="Ruta de navegación">
      @for (bc of breadcrumbs(); track bc.etiqueta; let last = $last) {
        @if (bc.url && !last) {
          <a [href]="bc.url" class="ui-page-header__breadcrumb">{{ bc.etiqueta }}</a>
          <span class="ui-page-header__separador" aria-hidden="true">/</span>
        } @else {
          <span class="ui-page-header__breadcrumb ui-page-header__breadcrumb--actual" aria-current="page">{{ bc.etiqueta }}</span>
        }
      }
    </nav>
    <div class="ui-page-header__titulos">
      @if (titulo()) { <h1 class="ui-page-header__titulo">{{ titulo() }}</h1> }
      @if (subtitulo()) { <p class="ui-page-header__subtitulo">{{ subtitulo() }}</p> }
    </div>
  </div>
  <div class="ui-page-header__acciones">
    @for (acc of acciones(); track acc.etiqueta) {
      <app-ui-button [variante]="acc.variante ?? 'primario'" (clic)="acc.clic()">{{ acc.etiqueta }}</app-ui-button>
    }
  </div>
</div>
